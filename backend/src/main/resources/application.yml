spring:
  application:
    name: student-assignment-tracker-api
  datasource:
    url: jdbc:mysql://${MYSQLHOST:${DB_HOST:localhost}}:${MYSQLPORT:${DB_PORT:3307}}/${MYSQLDATABASE:${DB_NAME:student_assignment_tracker}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: ${MYSQLUSER:${DB_USERNAME:tracker_app}}
    password: ${MYSQLPASSWORD:${DB_PASSWORD:tracker_dev_password}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MINIMUM_IDLE:2}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:${SERVER_PORT:8081}}
  servlet:
    context-path: /
  error:
    include-message: never
    include-binding-errors: never

application:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://*.up.railway.app,https://*.railway.app}
  security:
    jwt-secret: ${JWT_SECRET:student-assignment-tracker-local-development-secret-key-change-me}
    jwt-expiration: ${JWT_EXPIRATION:PT8H}
  demo-user:
    enabled: ${DEMO_USER_ENABLED:true}
    email: ${DEMO_USER_EMAIL:student@example.com}
    password: ${DEMO_USER_PASSWORD:Student@123}
    full-name: ${DEMO_USER_FULL_NAME:Demo Student}
