name: student-assignment-tracker

services:
  mysql:
    image: mysql:8.4.6
    container_name: student-assignment-tracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-student_assignment_tracker}
      MYSQL_USER: ${MYSQL_USER:-tracker_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tracker_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-tracker_root_dev_password}
      TZ: ${MYSQL_TIMEZONE:-Asia/Kolkata}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tracker-network

volumes:
  mysql-data:
    name: student-assignment-tracker-mysql-data

networks:
  tracker-network:
    name: student-assignment-tracker-network
